<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obrona Zamku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #120d09; overflow: hidden;
    font-family: 'Cinzel', Georgia, 'Times New Roman', serif; color: #f3e6c4; user-select: none; }
  #wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; box-shadow: 0 0 60px #000; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }

  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; font-size: clamp(11px, 1.35vw, 17px); pointer-events: none;
    background: linear-gradient(rgba(25,16,9,.85), rgba(25,16,9,0)); }
  .stat { background: rgba(28,18,10,.8); border: 1px solid #8a6a3a; border-radius: 6px; padding: 4px 12px;
    box-shadow: inset 0 0 8px rgba(0,0,0,.6); white-space: nowrap; }
  .stat b { color: #ffd772; }
  .stat.hp b { color: #ff8a73; }
  .spacer { flex: 1; }
  .btn { pointer-events: auto; font-family: inherit; font-size: inherit; color: #fbe9c0; cursor: pointer;
    background: linear-gradient(#8d5d2c, #5a3616); border: 1px solid #d4a85a; border-radius: 6px;
    padding: 5px 14px; text-shadow: 0 1px 0 #000; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .btn:hover:not(:disabled) { filter: brightness(1.15); }
  .btn:disabled { filter: grayscale(.9) brightness(.6); cursor: default; }
  .btn.big { font-size: 1.25em; padding: 10px 28px; }

  #menu { position: absolute; width: 300px; color: #2b1a0c; font-size: 13px; padding: 8px;
    background: linear-gradient(#f3e5c2, #d8bf8d); border: 2px solid #6b4a22; border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.65); z-index: 5; }
  #menu.hidden { display: none; }
  #menu h3 { margin: 2px 4px 6px; font-size: 15px; }
  #menu .opt { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font-family: inherit;
    background: rgba(255,255,255,.35); border: 1px solid #a07a44; border-radius: 6px; padding: 4px 6px;
    margin-bottom: 5px; cursor: pointer; color: inherit; }
  #menu .opt:hover:not(:disabled) { background: rgba(255,255,255,.7); }
  #menu .opt:disabled { opacity: .45; cursor: default; }
  #menu .opt img { width: 54px; height: 54px; flex: none; }
  #menu .opt .txt { flex: 1; }
  #menu .opt b { display: block; font-size: 13px; }
  #menu .opt small { font-family: Georgia, serif; font-size: 11.5px; line-height: 1.2; display: block; }
  #menu .cost { font-weight: 700; color: #7a4d00; white-space: nowrap; }
  #menu table { width: 100%; font-family: Georgia, serif; font-size: 12.5px; margin: 4px 0 8px; border-collapse: collapse; }
  #menu td { padding: 2px 4px; border-bottom: 1px solid rgba(107,74,34,.25); }
  #menu td.up { color: #1f6b1f; font-weight: bold; }
  #menu .row { display: flex; gap: 6px; }
  #menu .row .btn { flex: 1; font-size: 12.5px; padding: 6px 6px; }

  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(rgba(10,6,3,.55), rgba(10,6,3,.88)); z-index: 10; }
  #overlay.hidden { display: none; }
  .panel { text-align: center; max-width: 640px; padding: 28px 36px; border: 2px solid #8a6a3a; border-radius: 10px;
    background: linear-gradient(rgba(40,26,14,.94), rgba(22,14,8,.94)); box-shadow: 0 10px 40px #000; }
  .panel h1 { margin: 0 0 6px; font-size: clamp(26px, 4vw, 48px); color: #f6d27a; letter-spacing: 2px;
    text-shadow: 0 3px 0 #000; }
  .panel p { font-family: Georgia, serif; font-size: clamp(12px, 1.4vw, 16px); line-height: 1.5; color: #e9dcbc; }
  .panel ul { text-align: left; font-family: Georgia, serif; font-size: clamp(12px, 1.3vw, 15px); line-height: 1.55; color: #e9dcbc; }

  .panel h2 { font-size: clamp(14px, 1.6vw, 20px); color: #f6d27a; margin: 14px 0 8px; }
  .panel { max-height: 92%; overflow-y: auto; box-sizing: border-box; }
  .panel .msg { color: #9fe08a; }
  .panel .msg.warn { color: #ff9a7a; }
  .players { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; text-align: left; }
  .players .empty { text-align: center; font-style: italic; }
  .pl { position: relative; padding: 8px 40px 8px 12px; border: 1px solid #6b4a22; border-radius: 6px;
    background: rgba(255,255,255,.04); cursor: pointer; }
  .pl:hover { background: rgba(255,220,150,.1); }
  .pl.sel { border-color: #f6d27a; background: rgba(246,210,122,.16); box-shadow: 0 0 10px rgba(246,210,122,.3); }
  .pname { font-size: clamp(13px, 1.4vw, 17px); color: #fbe9c0; }
  .pinfo { font-family: Georgia, serif; font-size: 12px; color: #c9b993; margin-top: 2px; }
  .pl .del { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: 1px solid #6b4a22;
    color: #d9a07a; border-radius: 4px; cursor: pointer; width: 26px; height: 26px; }
  .pl .del:hover { background: #6b2a1a; color: #fff; }
  .newp { display: flex; gap: 8px; margin: 12px 0 4px; }
  .newp input { flex: 1; font-family: Georgia, serif; font-size: 15px; padding: 6px 10px; border-radius: 6px;
    border: 1px solid #8a6a3a; background: #f3e5c2; color: #2b1a0c; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  details { margin-top: 14px; text-align: left; font-family: Georgia, serif; font-size: 13px; color: #e9dcbc; }
  summary { cursor: pointer; color: #f6d27a; }
  .lvlname { color: #c9b993; font-size: .8em; margin-left: 4px; }
  #nextWave { position: absolute; top: 52px; right: 14px; font-family: Georgia, serif; font-size: clamp(10px, 1.05vw, 14px);
    background: rgba(28,18,10,.78); border: 1px solid #8a6a3a; border-radius: 6px; padding: 4px 10px; pointer-events: none; }
  #nextWave b { color: #ffd772; }
  #abilities { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 8px; }
  .ab { position: relative; overflow: hidden; width: clamp(92px, 9.5vw, 128px); padding: 8px 6px; font-family: inherit; cursor: pointer;
    color: #fbe9c0; background: linear-gradient(#3a5a86, #1d3456); border: 2px solid #8a6a3a; border-radius: 8px;
    box-shadow: 0 3px 10px rgba(0,0,0,.6); text-shadow: 0 1px 0 #000; }
  .ab b { display: block; font-size: clamp(10px, 1vw, 13px); position: relative; }
  .ab small { display: block; font-family: Georgia, serif; font-size: clamp(9px, .85vw, 11px); color: #c9d6e8; position: relative; }
  .ab .cdov { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.62); }
  .ab.ready { border-color: #f6d27a; }
  .ab.ready:hover { filter: brightness(1.2); }
  .ab:not(.ready) { cursor: default; }
  .ab.active { box-shadow: 0 0 16px #ffd772; border-color: #fff2b0; }
  .pstars { color: #f6d27a; font-size: .8em; margin-left: 6px; }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .lvl { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 10px; font-family: inherit; color: #fbe9c0; cursor: pointer;
    background: linear-gradient(rgba(90,60,30,.6), rgba(40,26,14,.8)); border: 1px solid #8a6a3a; border-radius: 8px; }
  .lvl:hover:not(:disabled) { border-color: #f6d27a; background: linear-gradient(rgba(120,80,40,.7), rgba(50,32,16,.85)); }
  .lvl.locked { opacity: .45; cursor: default; }
  .lnum { font-size: 11px; color: #c9b993; }
  .lname { font-size: clamp(12px, 1.25vw, 16px); color: #f6d27a; }
  .lstars { color: #ffd772; letter-spacing: 2px; }
  .ldesc { font-family: Georgia, serif; font-size: 11.5px; color: #e0d3b2; line-height: 1.3; }
  .bigstars { font-size: clamp(28px, 4vw, 46px); color: #ffd772; letter-spacing: 6px; text-shadow: 0 2px 0 #000; }
  .panel { max-width: 720px; }
  #banner { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); font-size: clamp(16px, 2.4vw, 30px);
    color: #f6d27a; text-shadow: 0 2px 0 #000, 0 0 12px #000; pointer-events: none; opacity: 0; transition: opacity .5s; white-space: nowrap; }
  #banner.show { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="stat">Gracz: <b id="pname">—</b></div>
    <div class="stat hp">Zamek: <b id="hp">20</b></div>
    <div class="stat">Złoto: <b id="gold">0</b></div>
    <div class="stat">Fala: <b id="wave">0 / 12</b> <span id="lvlname" class="lvlname"></span></div>
    <div class="spacer"></div>
    <button class="btn" id="btnWave">Wyślij falę 1</button>
    <button class="btn" id="btnRepair" title="Napraw zamek (R) albo kliknij zamek">Napraw</button>
    <button class="btn" id="btnSpeed" title="Prędkość gry">×1</button>
    <button class="btn" id="btnPause" title="Pauza (spacja)">Pauza</button>
    <button class="btn" id="btnMute" title="Dźwięk">Dźwięk: wł.</button>
    <button class="btn" id="btnMenu" title="Zapisz i wróć do wyboru gracza">Menu</button>
  </div>

  <div id="nextWave"></div>
  <div id="abilities">
    <button class="ab" id="abRain" title="Deszcz strzał (Q): wskaż miejsce na mapie"><span class="cdov"></span><b>Deszcz strzał</b><small>Q · obszar</small></button>
    <button class="ab" id="abHorn" title="Róg wojenny (W): wieże strzelają szybciej przez 8 s"><span class="cdov"></span><b>Róg wojenny</b><small>W · 8 sekund</small></button>
  </div>
  <div id="menu" class="hidden"></div>
  <div id="banner"></div>

  <div id="overlay">
    <div class="panel" id="panel"></div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
